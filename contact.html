<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Contact — A Little Spark</title>
  <style>
    :root { color-scheme: dark; --ink: #f6f4ff; --muted: #aaa9c2; --blue: #7bdcff; --pink: #ff83c8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(ellipse at 50% 115%, #30205f 0, transparent 55%), radial-gradient(ellipse at 12% 12%, #162d55 0, transparent 40%), #0b1020; }
    .stars { position: fixed; inset: 0; pointer-events: none; opacity: .45; background-image: radial-gradient(1px 1px at 15% 24%, #fff 99%, transparent), radial-gradient(1px 1px at 75% 18%, #fff 99%, transparent), radial-gradient(1.5px 1.5px at 83% 68%, #fff 99%, transparent), radial-gradient(1px 1px at 28% 79%, #fff 99%, transparent), radial-gradient(1px 1px at 58% 43%, #fff 99%, transparent); background-size: 310px 260px; }
    nav { position: absolute; z-index: 2; top: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; padding: 6px; border: 1px solid #ffffff20; border-radius: 99px; background: #ffffff08; backdrop-filter: blur(10px); }
    nav a { padding: 9px 15px; border-radius: 99px; color: #d1d1e4; font-size: 13px; text-decoration: none; transition: background .2s, color .2s; }
    nav a:hover, nav a[aria-current="page"] { color: var(--ink); background: #ffffff16; }
    nav a:focus-visible { outline: 2px solid white; outline-offset: 3px; }
    main { width: min(760px, calc(100% - 40px)); padding: 110px 32px 70px; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 18px 0; font-size: clamp(2.8rem, 8vw, 5.6rem); line-height: .98; letter-spacing: -.07em; }
    h1 span { background: linear-gradient(100deg, var(--blue), #b7a1ff 52%, var(--pink)); color: transparent; background-clip: text; -webkit-background-clip: text; }
    p { max-width: 610px; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.8; }
    .card { margin-top: 36px; padding: 24px; border: 1px solid #ffffff18; border-radius: 20px; background: #ffffff08; box-shadow: 0 20px 70px #0003; }
    .card h2 { margin: 0 0 10px; font-size: 1rem; }
    .card p { margin: 0; font-size: .98rem; }
    .contact-link { display: inline-flex; margin-top: 20px; padding: 12px 18px; border-radius: 99px; color: #101222; font-weight: 700; text-decoration: none; background: linear-gradient(110deg, #a8eaff, #d0b2ff 55%, #ffabd9); transition: transform .2s; }
    .contact-link:hover { transform: translateY(-2px); }
    .contact-link:focus-visible { outline: 2px solid white; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
  <main>
    <div class="eyebrow">Say hello</div>
    <h1>Have an idea?<br><span>Let’s talk.</span></h1>
    <p>Questions, feedback, or a new idea to share? I’d be glad to hear from you.</p>
    <section class="card">
      <h2>Get in touch</h2>
      <p>Add your preferred email address to this page to make it easy for visitors to reach you.</p>
    </section>
  </main>
</body>
</html>
